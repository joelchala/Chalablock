name: Chalablock build

# Builds the Chromium and Edge packages and attaches them to a GitHub release.
# Runs when a version tag (x.y.z) is pushed, or manually from the Actions tab.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: true

permissions:
  contents: write # to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build packages
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          mkdir -p dist/build/mv3-data
          tools/make-mv3.sh chromium "$VERSION"
          tools/make-mv3.sh edge "$VERSION"
      - name: Publish release
        run: |
          gh release create "$VERSION" dist/build/Chalablock_*.zip \
            --target "$GITHUB_SHA" --title "Chalablock $VERSION" --generate-notes
